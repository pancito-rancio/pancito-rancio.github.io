<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yape Survey Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <!-- Botón de Contador en la Esquina Izquierda -->
    <div class="counter-floating-box">
        <button class="btn-counter" title="Total de formularios enviados">
            LISTA: <span id="userCount">0</span>
        </button>
    </div>

    <nav class="navbar fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-qr-code-scan me-2"></i><span>cuestionario yape</span>
            </a>
            <div class="d-flex gap-2" id="mainNav">
                <button class="btn btn-sm nav-link-custom active" onclick="showSection('formSection', this)">Formulario</button>
                <button class="btn btn-sm nav-link-custom" onclick="showSection('statsSection', this)">Análisis</button>
            </div>
        </div>
    </nav>

    <main class="container main-content">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                
                <!-- Formulario -->
                <section id="formSection" class="section-card active">
                    <div class="card">
                        <h4 class="mb-4 fw-bold">Nueva Respuesta</h4>
                        <form id="encuestaForm">
                            <div id="questionsContainer"></div>
                            <button type="submit" class="btn btn-primary w-100 mt-4">Enviar Encuesta</button>
                        </form>
                    </div>
                </section>

                <!-- Análisis (Stats + Charts) -->
                <section id="statsSection" class="section-card">
                    <div class="row g-4 mb-4" id="statsOverview"></div>
                    <div id="chartsContainer" class="d-flex flex-column gap-5"></div>
                </section>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../static/js/app.js"></script>
</body>
</html>
